<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 OffGrid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=VT323&family=Fredoka:wght@500;700&family=Orbitron:wght@500;700&family=Press+Start+2P&display=swap');

        /* --- CSS Variables (Default: NEON) --- */
        :root {
            --bg-body: #0f0f1a;
            --text-main: #fff;
            --text-accent: #ff0055;
            --ui-border: rgba(255, 255, 255, 0.15);
            --btn-bg: rgba(255, 255, 255, 0.08);
            --font-main: 'Chakra Petch', sans-serif;
            --font-display: 'Chakra Petch', sans-serif;
            
            /* Game-specific colors */
            --grid-bg: #22223b;
            --tile-0-bg: rgba(255, 255, 255, 0.03);
            --tile-light-text: #ffffff;
            --tile-dark-text: #0f0f1a;

            --tile-2-bg: #4a4e69;
            --tile-4-bg: #6a6e9a;
            --tile-8-bg: #0DC2FF;
            --tile-16-bg: #0DFF72;
            --tile-32-bg: #3877FF;
            --tile-64-bg: #F538FF;
            --tile-128-bg: #FF8E0D;
            --tile-256-bg: #FFE138;
            --tile-512-bg: #FF0D72;
            --tile-1024-bg: #ff4d94;
            --tile-2048-bg: #ff80b7;
            --tile-super-bg: #ffffff;
        }

        /* --- Theme Overrides --- */
        body.theme-vaporwave { --bg-body: #2b0f54; --text-main: #00f3ff; --text-accent: #ff00ff; --ui-border: #ff00ff; --font-main: 'Orbitron'; --font-display: 'Orbitron'; background: linear-gradient(180deg, #2b0f54, #ff0080); --grid-bg: #1a0b2e; --tile-0-bg: rgba(0, 255, 255, 0.05); --tile-light-text: #fff; --tile-dark-text: #1a0b2e; --tile-2-bg: #4b2370; --tile-4-bg: #6b30a0; --tile-8-bg: #01cdfe; --tile-16-bg: #05ffa1; --tile-32-bg: #b967ff; --tile-64-bg: #ff00ff; --tile-128-bg: #ff71ce; --tile-256-bg: #fffb96; --tile-512-bg: #00f3ff; --tile-1024-bg: #ff0080; --tile-2048-bg: #f890e7; --tile-super-bg: #fff; }
        body.theme-gameboy { --bg-body: #8b9c48; --text-main: #0f380f; --text-accent: #306230; --ui-border: #306230; --btn-bg: rgba(15,56,15,0.1); --font-main: 'VT323'; --font-display: 'VT323'; --grid-bg: #7c8a40; --tile-0-bg: rgba(15, 56, 15, 0.05); --tile-light-text: #0f380f; --tile-dark-text: #9bbc0f; --tile-2-bg: #9bbc0f; --tile-4-bg: #8bac0f; --tile-8-bg: #306230; --tile-16-bg: #0f380f; --tile-32-bg: #306230; --tile-64-bg: #0f380f; --tile-128-bg: #306230; --tile-256-bg: #0f380f; --tile-512-bg: #306230; --tile-1024-bg: #0f380f; --tile-2048-bg: #306230; --tile-super-bg: #0f380f; }
        body.theme-matrix { --bg-body: #000; --text-main: #00ff00; --text-accent: #00ff00; --ui-border: #004400; --btn-bg: #001100; --font-main: 'VT323'; --font-display: 'VT323'; --grid-bg: #001100; --tile-0-bg: rgba(0, 255, 0, 0.02); --tile-light-text: #00ff00; --tile-dark-text: #000; --tile-2-bg: #002200; --tile-4-bg: #004400; --tile-8-bg: #006600; --tile-16-bg: #008800; --tile-32-bg: #00aa00; --tile-64-bg: #00cc00; --tile-128-bg: #00ff00; --tile-256-bg: #33ff33; --tile-512-bg: #66ff66; --tile-1024-bg: #99ff99; --tile-2048-bg: #ccffcc; --tile-super-bg: #fff; }
        body.theme-candy { --bg-body: #fff0f5; --text-main: #555; --text-accent: #ff69b4; --ui-border: #ffb7b2; --btn-bg: rgba(255,183,178,0.2); --font-main: 'Fredoka'; --font-display: 'Fredoka'; --grid-bg: #ffebf0; --tile-0-bg: rgba(0, 0, 0, 0.02); --tile-light-text: #555; --tile-dark-text: #fff; --tile-2-bg: #FFF8E7; --tile-4-bg: #FFEED1; --tile-8-bg: #FFDAC1; --tile-16-bg: #E2F0CB; --tile-32-bg: #B5EAD7; --tile-64-bg: #C7CEEA; --tile-128-bg: #FFB7B2; --tile-256-bg: #FF9AA2; --tile-512-bg: #ff85a8; --tile-1024-bg: #ff69b4; --tile-2048-bg: #ff4d9f; --tile-super-bg: #333; }
        body.theme-darkpro { --bg-body: #0a0a0a; --text-main: #f0f0f0; --text-accent: #3b82f6; --ui-border: #3b82f6; --btn-bg: rgba(59, 130, 246, 0.1); --font-main: 'Chakra Petch'; --font-display: 'Chakra Petch'; --grid-bg: #111; --tile-0-bg: #222; --tile-light-text: #f0f0f0; --tile-dark-text: #111; --tile-2-bg: #333; --tile-4-bg: #444; --tile-8-bg: #10b981; --tile-16-bg: #f59e0b; --tile-32-bg: #ef4444; --tile-64-bg: #8b5cf6; --tile-128-bg: #a3a3a3; --tile-256-bg: #e5e5e5; --tile-512-bg: #3b82f6; --tile-1024-bg: #60a5fa; --tile-2048-bg: #93c5fd; --tile-super-bg: #fff; }

        /* --- Base Styles --- */
        body {
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-main);
            overflow: hidden;
            touch-action: none; 
            height: 100dvh;
            width: 100vw;
            transition: background 0.4s ease, color 0.4s ease;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
        }
        
        #score, #high-score, #overlay-title, .util-btn {
            font-family: var(--font-display);
        }

        .util-btn {
            font-size: 0.7rem;
            padding: 8px 12px;
            border: 1px solid var(--ui-border);
            border-radius: 4px;
            cursor: pointer;
            background: var(--btn-bg);
            color: var(--text-main);
            transition: all 0.2s;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            background-color: var(--grid-bg);
            border: 4px solid var(--grid-bg);
            border-radius: 8px;
            padding: 10px;
            width: 90vw;
            height: 90vw;
            max-width: 450px;
            max-height: 450px;
            touch-action: none;
            position: relative;
        }

        .grid-cell {
            background-color: var(--tile-0-bg);
            border-radius: 4px;
        }

        .tile {
            position: absolute;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: top 0.1s ease-in-out, left 0.1s ease-in-out, transform 0.1s ease-in-out, background-color 0.2s;
            animation: spawn 0.2s;
        }
        
        @keyframes spawn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* --- Tile Theme Colors --- */
        .tile-2 { background-color: var(--tile-2-bg); color: var(--tile-light-text); }
        .tile-4 { background-color: var(--tile-4-bg); color: var(--tile-light-text); }
        .tile-8 { background-color: var(--tile-8-bg); color: var(--tile-light-text); }
        .tile-16 { background-color: var(--tile-16-bg); color: var(--tile-light-text); }
        .tile-32 { background-color: var(--tile-32-bg); color: var(--tile-light-text); }
        .tile-64 { background-color: var(--tile-64-bg); color: var(--tile-light-text); }
        .tile-128 { background-color: var(--tile-128-bg); color: var(--tile-dark-text); }
        .tile-256 { background-color: var(--tile-256-bg); color: var(--tile-dark-text); }
        .tile-512 { background-color: var(--tile-512-bg); color: var(--tile-dark-text); }
        .tile-1024 { background-color: var(--tile-1024-bg); color: var(--tile-dark-text); }
        .tile-2048 { background-color: var(--tile-2048-bg); color: var(--tile-dark-text); }
        .tile-super { background-color: var(--tile-super-bg); color: var(--tile-dark-text); }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-2">

    <!-- Top Bar -->
    <div class="w-full max-w-lg flex justify-between items-center p-2 z-10">
        <div class="flex flex-col items-start">
            <div class="text-[10px] opacity-70">SCORE</div>
            <div class="text-3xl font-bold tracking-widest" id="score">0</div>
        </div>
        <div class="flex gap-2">
            <button id="theme-btn" class="util-btn">THEME: NEON</button>
            <button id="new-game-btn" class="util-btn">NEW GAME</button>
        </div>
        <div class="flex flex-col items-end">
            <div class="text-[10px] opacity-70">HIGH SCORE</div>
            <div class="text-3xl font-bold tracking-widest" id="high-score">0</div>
        </div>
    </div>

    <!-- Game Area -->
    <div class="relative flex-1 min-h-0 w-full flex items-center justify-center py-2">
        <div id="game-board">
            <!-- Tiles will be added here by JS -->
        </div>
        
        <!-- Overlay -->
        <div id="overlay" class="absolute inset-0 flex-col items-center justify-center z-20 text-center p-4 bg-black/80 backdrop-blur-md rounded-lg border-2 border-[var(--ui-border)]" style="display: none;">
            <h2 id="overlay-title" class="text-5xl font-bold mb-2 tracking-tighter text-[var(--text-accent)] drop-shadow-lg">GAME OVER</h2>
            <div class="text-lg opacity-90 mb-8 font-mono">Final Score: <span id="final-score">0</span></div>
            <button id="try-again-btn" class="px-8 py-4 bg-[var(--text-accent)] text-[var(--bg-body)] font-bold text-xl rounded shadow-lg active:scale-95 transition-transform border border-white/20 mb-4 cursor-pointer z-50">
                TRY AGAIN
            </button>
        </div>
    </div>

    <!-- Spacer -->
    <div class="w-full h-16"></div>

    <script>
        // --- 1. Theme Engine ---
        const THEMES = [
            { name: 'NEON', id: '' },
            { name: 'VAPOR', id: 'theme-vaporwave' },
            { name: 'GAMEBOY', id: 'theme-gameboy' },
            { name: 'MATRIX', id: 'theme-matrix' },
            { name: 'CANDY', id: 'theme-candy' },
            { name: 'DARKPRO', id: 'theme-darkpro' }
        ];

        let themeIndex = 0;
        let currentTheme = THEMES[0];

        document.getElementById('theme-btn').addEventListener('click', () => {
            if(currentTheme.id) document.body.classList.remove(currentTheme.id);
            themeIndex = (themeIndex + 1) % THEMES.length;
            currentTheme = THEMES[themeIndex];
            if(currentTheme.id) document.body.classList.add(currentTheme.id);
            document.getElementById('theme-btn').innerText = `THEME: ${currentTheme.name}`;
        });

        // --- 2. Game Logic ---
        const gameBoard = document.getElementById('game-board');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const overlay = document.getElementById('overlay');
        const finalScoreEl = document.getElementById('final-score');
        
        let grid = [];
        let score = 0;
        let highScore = localStorage.getItem('2048_hs') || 0;
        let isGameOver = false;
        let boardSize = 4;
        let cellSize = 0;
        let cellGap = 10;

        function initGame() {
            grid = Array(boardSize).fill(null).map(() => Array(boardSize).fill(0));
            score = 0;
            isGameOver = false;
            highScoreEl.innerText = highScore;
            overlay.style.display = 'none';
            
            setupBoard();
            addRandomTile();
            addRandomTile();
            updateUI();
        }
        
        function setupBoard() {
            gameBoard.innerHTML = ''; // Clear board
            
            // Calculate cell size based on board size
            const boardRect = gameBoard.getBoundingClientRect();
            cellSize = (boardRect.width - (cellGap * (boardSize + 1))) / boardSize;
            cellGap = (boardRect.width - (cellSize * boardSize)) / (boardSize + 1);

            gameBoard.style.gap = `${cellGap}px`;
            gameBoard.style.padding = `${cellGap}px`;

            for (let i = 0; i < boardSize * boardSize; i++) {
                const cell = document.createElement('div');
                cell.classList.add('grid-cell');
                cell.style.width = `${cellSize}px`;
                cell.style.height = `${cellSize}px`;
                gameBoard.appendChild(cell);
            }
        }

        function updateUI() {
            // Remove existing tiles
            const existingTiles = gameBoard.querySelectorAll('.tile');
            existingTiles.forEach(tile => tile.remove());

            // Add new tiles
            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    if (grid[r][c] !== 0) {
                        const tile = document.createElement('div');
                        const tileValue = grid[r][c];
                        tile.classList.add('tile');
                        tile.classList.add(tileValue > 2048 ? 'tile-super' : `tile-${tileValue}`);
                        
                        // Adjust font size for bigger numbers
                        if (tileValue > 10000) tile.style.fontSize = "1.5rem";
                        else if (tileValue > 1000) tile.style.fontSize = "2rem";
                        
                        tile.style.width = `${cellSize}px`;
                        tile.style.height = `${cellSize}px`;
                        
                        // Position tile
                        tile.style.top = `${r * cellSize + (r + 1) * cellGap}px`;
                        tile.style.left = `${c * cellSize + (c + 1) * cellGap}px`;
                        
                        tile.innerText = tileValue;
                        gameBoard.appendChild(tile);
                    }
                }
            }
            scoreEl.innerText = score;
            if (score > highScore) {
                highScore = score;
                highScoreEl.innerText = highScore;
                localStorage.setItem('2048_hs', highScore);
            }
        }

        function addRandomTile() {
            const emptyCells = [];
            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    if (grid[r][c] === 0) emptyCells.push({ r, c });
                }
            }
            if (emptyCells.length > 0) {
                const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                grid[r][c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function handleInput(e) {
            if (isGameOver) return;
            let moved = false;
            
            switch (e.key) {
                case 'ArrowUp': moved = moveUp(); break;
                case 'ArrowDown': moved = moveDown(); break;
                case 'ArrowLeft': moved = moveLeft(); break;
                case 'ArrowRight': moved = moveRight(); break;
                default: return;
            }
            
            if (moved) {
                setTimeout(() => {
                    addRandomTile();
                    updateUI();
                    if (!canMove()) {
                        setGameOver();
                    }
                }, 100); // Wait for tile animations
            }
        }
        
        // --- Movement Logic ---
        function slide(row) { // Slides tiles to the left
            let newRow = row.filter(val => val); // [0, 2, 0, 2] -> [2, 2]
            let zeros = Array(boardSize - newRow.length).fill(0); // [0, 0]
            return newRow.concat(zeros); // [2, 2, 0, 0]
        }

        function combine(row) { // Combines adjacent tiles
            let newRow = slide(row);
            for (let i = 0; i < boardSize - 1; i++) {
                if (newRow[i] !== 0 && newRow[i] === newRow[i+1]) {
                    newRow[i] *= 2;
                    score += newRow[i];
                    newRow[i+1] = 0;
                }
            }
            return slide(newRow); // Slide again after combining
        }
        
        function moveLeft() {
            let moved = false;
            for (let r = 0; r < boardSize; r++) {
                const originalRow = [...grid[r]];
                grid[r] = combine(grid[r]);
                if (!moved && grid[r].join(',') !== originalRow.join(',')) {
                    moved = true;
                }
            }
            return moved;
        }
        
        function moveRight() {
            let moved = false;
            for (let r = 0; r < boardSize; r++) {
                const originalRow = [...grid[r]];
                grid[r] = combine(grid[r].reverse()).reverse();
                if (!moved && grid[r].join(',') !== originalRow.join(',')) {
                    moved = true;
                }
            }
            return moved;
        }
        
        // Helper to rotate grid 90 degrees
        function rotateGrid(gridToRotate) {
            let newGrid = Array(boardSize).fill(null).map(() => Array(boardSize).fill(0));
            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    newGrid[c][boardSize - 1 - r] = gridToRotate[r][c];
                }
            }
            return newGrid;
        }

        function moveUp() {
            let moved = false;
            let originalGrid = JSON.stringify(grid);
            let rotated = rotateGrid(grid); // Rotate 90 deg right
            for (let r = 0; r < boardSize; r++) {
                rotated[r] = combine(rotated[r].reverse()).reverse(); // Move Right
            }
            grid = rotateGrid(rotateGrid(rotateGrid(rotated))); // Rotate 3x more (270)
            return JSON.stringify(grid) !== originalGrid;
        }

        function moveDown() {
            let moved = false;
            let originalGrid = JSON.stringify(grid);
            let rotated = rotateGrid(grid); // Rotate 90 deg right
            for (let r = 0; r < boardSize; r++) {
                rotated[r] = combine(rotated[r]); // Move Left
            }
            grid = rotateGrid(rotateGrid(rotateGrid(rotated))); // Rotate 3x more (270)
            return JSON.stringify(grid) !== originalGrid;
        }
        
        // --- Game Over Logic ---
        function canMove() {
            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    if (grid[r][c] === 0) return true; // Empty cell
                    if (r < boardSize - 1 && grid[r][c] === grid[r+1][c]) return true; // Vertical merge
                    if (c < boardSize - 1 && grid[r][c] === grid[r][c+1]) return true; // Horizontal merge
                }
            }
            return false;
        }
        
        function setGameOver() {
            isGameOver = true;
            finalScoreEl.innerText = score;
            overlay.style.display = 'flex';
        }

        // --- Touch Controls ---
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        
        gameBoard.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });
        
        gameBoard.addEventListener('touchmove', e => {
            touchEndX = e.touches[0].clientX;
            touchEndY = e.touches[0].clientY;
        }, { passive: true });
        
        gameBoard.addEventListener('touchend', e => {
            if (isGameOver) return;
            
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            const threshold = 50; // Min swipe distance
            
            let moved = false;
            
            if (Math.abs(diffX) > Math.abs(diffY)) { // Horizontal swipe
                if (diffX > threshold) moved = moveRight();
                else if (diffX < -threshold) moved = moveLeft();
            } else { // Vertical swipe
                if (diffY > threshold) moved = moveDown();
                else if (diffY < -threshold) moved = moveUp();
            }
            
            if (moved) {
                setTimeout(() => {
                    addRandomTile();
                    updateUI();
                    if (!canMove()) {
                        setGameOver();
                    }
                }, 100);
            }
            
            // Reset touch coordinates
            touchStartX = 0; touchStartY = 0; touchEndX = 0; touchEndY = 0;
        });

        // --- Event Listeners ---
        document.addEventListener('keydown', handleInput);
        document.getElementById('new-game-btn').addEventListener('click', initGame);
        document.getElementById('try-again-btn').addEventListener('click', initGame);
        
        // Handle window resize
        window.addEventListener('resize', () => {
            setupBoard();
            updateUI();
        });

        // --- Initial setup ---
        initGame();
    </script>
</body>
</html>
