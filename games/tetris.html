<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris OffGrid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=VT323&family=Fredoka:wght@500&family=Orbitron:wght@500&family=Press+Start+2P&display=swap');

        /* --- CSS Variables (Default: NEON) --- */
        :root {
            --bg-body: #0f0f1a;
            --bg-canvas: rgba(0, 0, 0, 0.9);
            --grid-line: rgba(255, 255, 255, 0.05);
            --text-main: #fff;
            --text-accent: #ff0055;
            --ui-border: rgba(255, 255, 255, 0.15);
            --btn-bg: rgba(255, 255, 255, 0.08);
            --font-main: 'Chakra Petch', sans-serif;
            --font-display: 'Chakra Petch', sans-serif;
        }

        /* --- Theme Overrides --- */
        body.theme-vaporwave { --bg-body: #2b0f54; --bg-canvas: #1a0b2e; --grid-line: rgba(0,255,255,0.1); --text-main: #00f3ff; --text-accent: #ff00ff; --ui-border: #ff00ff; --font-main: 'Orbitron'; --font-display: 'Orbitron'; background: linear-gradient(180deg, #2b0f54, #ff0080); }
        body.theme-gameboy { --bg-body: #8b9c48; --bg-canvas: #9bbc0f; --grid-line: rgba(15,56,15,0.15); --text-main: #0f380f; --text-accent: #306230; --ui-border: #306230; --btn-bg: rgba(15,56,15,0.1); --font-main: 'VT323'; --font-display: 'VT323'; }
        body.theme-matrix { --bg-body: #000; --bg-canvas: #000; --grid-line: #003300; --text-main: #00ff00; --text-accent: #00ff00; --ui-border: #004400; --btn-bg: #001100; --font-main: 'VT323'; --font-display: 'VT323'; }
        body.theme-candy { --bg-body: #fff0f5; --bg-canvas: #fff; --grid-line: #f0e6e6; --text-main: #555; --text-accent: #ff69b4; --ui-border: #ffb7b2; --btn-bg: rgba(255,183,178,0.2); --font-main: 'Fredoka'; --font-display: 'Fredoka'; }
        body.theme-blueprint { --bg-body: #004488; --bg-canvas: #003366; --grid-line: rgba(255,255,255,0.2); --text-main: #fff; --text-accent: #fff; --ui-border: #fff; --btn-bg: rgba(255,255,255,0.05); --font-main: 'Courier New'; --font-display: 'Courier New'; }
        body.theme-dracula { --bg-body: #282a36; --bg-canvas: #44475a; --grid-line: #6272a4; --text-main: #f8f8f2; --text-accent: #bd93f9; --ui-border: #6272a4; --btn-bg: rgba(98, 114, 164, 0.1); --font-main: 'Chakra Petch'; --font-display: 'Chakra Petch'; }
        body.theme-ocean { --bg-body: #00171f; --bg-canvas: #003459; --grid-line: #007ea7; --text-main: #fff; --text-accent: #00a8e8; --ui-border: #007ea7; --btn-bg: rgba(0, 168, 232, 0.1); --font-main: 'Orbitron'; --font-display: 'Orbitron'; }
        body.theme-sunset { --bg-body: #3a0ca3; --bg-canvas: #3a0ca3; --grid-line: #f72585; --text-main: #4cc9f0; --text-accent: #f72585; --ui-border: #f72585; --btn-bg: rgba(247, 37, 133, 0.1); --font-main: 'Fredoka'; --font-display: 'Fredoka'; background: linear-gradient(180deg, #3a0ca3, #f72585); }
        body.theme-mono { --bg-body: #000; --bg-canvas: #222; --grid-line: #444; --text-main: #fff; --text-accent: #fff; --ui-border: #666; --btn-bg: rgba(255,255,255,0.1); --font-main: monospace; --font-display: monospace; }
        
        /* RADICAL THEMES */
        body.theme-glitch { --bg-body: #110022; --bg-canvas: #000; --grid-line: #440099; --text-main: #00ffff; --text-accent: #ff00ff; --ui-border: #ff00ff; --btn-bg: rgba(255,0,255,0.1); --font-main: 'Press Start 2P'; --font-display: 'Press Start 2P'; box-shadow: 0 0 10px #ff00ff; }
        body.theme-lava { --bg-body: #4a0000; --bg-canvas: #2e0000; --grid-line: #990000; --text-main: #ffbb00; --text-accent: #ff4500; --ui-border: #ff8c00; --btn-bg: rgba(255, 69, 0, 0.2); --font-main: 'Orbitron'; --font-display: 'Orbitron'; }
        body.theme-8bit { --bg-body: #333333; --bg-canvas: #666666; --grid-line: #444444; --text-main: #ffffff; --text-accent: #ffff00; --ui-border: #ffff00; --btn-bg: rgba(255, 255, 0, 0.2); --font-main: 'Press Start 2P'; --font-display: 'Press Start 2P'; image-rendering: pixelated; }
        body.theme-darkpro { --bg-body: #0a0a0a; --bg-canvas: #1c1c1c; --grid-line: rgba(255, 255, 255, 0.03); --text-main: #f0f0f0; --text-accent: #3b82f6; --ui-border: #3b82f6; --btn-bg: rgba(59, 130, 246, 0.1); --font-main: 'Chakra Petch'; --font-display: 'Chakra Petch'; }

        /* --- Base Styles --- */
        body {
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-main);
            overflow: hidden;
            touch-action: none; 
            height: 100dvh;
            width: 100vw;
            transition: background 0.4s ease, color 0.4s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .game-canvas {
            image-rendering: pixelated;
            background-color: var(--bg-canvas);
            border: 2px solid var(--ui-border);
            max-height: 100%;
            max-width: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            transition: border-color 0.4s ease, background-color 0.4s ease;
        }
        
        /* Apply display font to score and titles */
        #score, #overlay-title, #high-score, #level, .util-btn {
            font-family: var(--font-display);
        }

        /* --- Controls --- */
        .control-btn {
            background: var(--btn-bg);
            border: 1px solid var(--ui-border);
            backdrop-filter: blur(4px);
            transition: transform 0.05s, background 0.05s;
            touch-action: manipulation;
            color: var(--text-main);
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        .control-btn:active, .control-btn.active-state {
            background: var(--text-accent);
            color: var(--bg-body);
            transform: scale(0.95);
            border-color: var(--text-accent);
        }

        .d-pad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 160px;
        }

        .util-btn {
            font-size: 0.7rem;
            padding: 8px 12px;
            border: 1px solid var(--ui-border);
            border-radius: 4px;
            cursor: pointer;
            background: var(--btn-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .disabled-hold {
            opacity: 0.3;
            pointer-events: none;
        }

        .scanlines {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 5;
            opacity: 0.1;
        }

        .muted {
            opacity: 0.5;
            text-decoration: line-through;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-2">

    <!-- Top Bar -->
    <div class="w-full max-w-lg flex justify-between items-start h-[16dvh] pt-2 z-10">
        <div class="flex flex-col items-center w-20">
            <div class="text-[10px] opacity-70 font-bold mb-1 tracking-wider">HOLD</div>
            <canvas id="hold-canvas" width="80" height="80" class="game-canvas rounded w-[50px] h-[50px] sm:w-[65px] sm:h-[65px]"></canvas>
        </div>

        <div class="flex flex-col items-center justify-start pt-1 gap-2 flex-1">
            <div class="flex gap-2">
                <button id="theme-btn" class="util-btn">THEME: NEON</button>
                <button id="music-btn" class="util-btn muted"><i class="fas fa-music"></i></button>
            </div>
            <div class="flex flex-col items-center mt-1">
                <div class="text-4xl font-bold tracking-widest leading-none" id="score">0</div>
                <div class="text-[10px] opacity-60 font-mono mt-1">LEVEL <span id="level">1</span></div>
            </div>
        </div>

        <div class="flex flex-col items-center w-20">
            <div class="text-[10px] opacity-70 font-bold mb-1 tracking-wider">NEXT</div>
            <canvas id="next-canvas" width="80" height="80" class="game-canvas rounded w-[50px] h-[50px] sm:w-[65px] sm:h-[65px]"></canvas>
        </div>
    </div>

    <!-- Game Area -->
    <div class="relative flex-1 min-h-0 w-full flex items-center justify-center py-2">
        <div class="relative h-full w-full flex items-center justify-center">
            <canvas id="tetris" width="240" height="400" class="game-canvas"></canvas>
            <div class="scanlines"></div>
            
            <!-- Overlay -->
            <div id="overlay" class="absolute inset-0 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center z-20 rounded border-2 border-[var(--ui-border)] text-center p-4">
                <h2 id="overlay-title" class="text-5xl font-bold mb-2 tracking-tighter text-[var(--text-accent)] drop-shadow-lg">TETRIS</h2>
                <div class="text-xs opacity-70 mb-8 font-mono">HIGH SCORE: <span id="high-score">0</span></div>
                
                <button id="start-btn" class="px-8 py-4 bg-[var(--text-accent)] text-[var(--bg-body)] font-bold text-xl rounded shadow-lg active:scale-95 transition-transform border border-white/20 mb-4 cursor-pointer z-50">
                    START GAME
                </button>
                
                <div class="flex flex-col gap-1 text-[10px] text-gray-500 mt-2">
                    <p>Mobile: D-Pad to Move • Tap Rotate</p>
                    <p>PC: Arrow Keys • Space to Drop</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="w-full max-w-lg h-[26dvh] grid grid-cols-2 gap-4 pb-4 select-none z-10">
        <div class="flex items-center justify-center">
            <div class="d-pad-grid">
                <button class="control-btn rounded-lg h-14 flex items-center justify-center" id="btn-hold"><span class="text-[10px] font-bold">HOLD</span></button>
                <button class="control-btn rounded-lg h-14 flex items-center justify-center" id="btn-rotate"><i class="fas fa-undo transform rotate-180 text-lg"></i></button>
                <div class="h-14"></div>
                <button class="control-btn rounded-lg h-14 flex items-center justify-center" id="btn-left"><i class="fas fa-chevron-left text-lg"></i></button>
                <button class="control-btn rounded-lg h-14 flex items-center justify-center" id="btn-down"><i class="fas fa-chevron-down text-lg"></i></button>
                <button class="control-btn rounded-lg h-14 flex items-center justify-center" id="btn-right"><i class="fas fa-chevron-right text-lg"></i></button>
            </div>
        </div>
        <div class="flex items-center justify-center pr-4">
            <button class="control-btn rounded-full w-24 h-24 flex flex-col items-center justify-center gap-1 shadow-xl border-2" id="btn-drop">
                <i class="fas fa-angle-double-down text-3xl"></i>
                <span class="text-[10px] font-bold tracking-wider">DROP</span>
            </button>
        </div>
    </div>

    <script>
        // --- 1. Robust Audio System ---
        const SoundSystem = {
            ctx: null,
            isPlaying: false,
            enabled: false,
            timer: null,
            BPM: 260, // Even faster!
            
            init: function() {
                if (this.ctx) return true;
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if(AudioContext) {
                        this.ctx = new AudioContext();
                        return true;
                    }
                } catch(e) { console.error("Audio not supported"); }
                return false;
            },

            resume: function() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },

            toggle: function() {
                if(!this.init()) return;
                this.resume();
                
                this.enabled = !this.enabled;
                const btn = document.getElementById('music-btn');
                
                if(this.enabled) {
                    btn.classList.remove('muted');
                    btn.style.color = "var(--text-accent)";
                    btn.style.borderColor = "var(--text-accent)";
                    this.start();
                } else {
                    btn.classList.add('muted');
                    btn.style.color = "var(--text-main)";
                    btn.style.borderColor = "var(--ui-border)";
                    this.stop();
                }
            },

            playNote: function(freq, time, dur) {
                if (!this.ctx || !this.enabled) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.value = freq;
                    
                    const now = this.ctx.currentTime;
                    const safeTime = Math.max(time, now);
                    const safeEnd = Math.max(safeTime + dur - 0.05, safeTime + 0.01);

                    gain.gain.setValueAtTime(0.05, safeTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, safeEnd);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(safeTime);
                    osc.stop(safeTime + dur);
                } catch(e) { /* Ignore audio glitches */ }
            },

            start: function() {
                if(!this.enabled || this.isPlaying || !this.ctx) return;
                this.isPlaying = true;
                this.noteIndex = 0;
                this.nextNoteTime = this.ctx.currentTime + 0.1;
                this.scheduler();
            },

            stop: function() {
                this.isPlaying = false;
                clearTimeout(this.timer);
            },

            scheduler: function() {
                if(!this.isPlaying) return;
                // Tetris Melody (Korobeiniki)
                const melody = [
                    [659,2],[493,1],[523,1],[587,2],[523,1],[493,1],[440,2],[440,1],[523,1],[659,2],[587,1],[523,1],
                    [493,2],[493,0.5],[523,0.5],[587,2],[659,2],[523,2],[440,2],[440,2],[0,1],
                    [587,2],[698,1],[440,2],[783,1],[698,1],[659,2],[523,1],[659,2],[587,1],[523,1],
                    [493,2],[493,0.5],[523,0.5],[587,2],[659,2],[523,2],[440,2],[440,2],[0,1]
                ];
                
                const secondsPerBeat = 60.0 / this.BPM;
                
                while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
                    const note = melody[this.noteIndex % melody.length];
                    if(note[0] > 0) this.playNote(note[0], this.nextNoteTime, note[1] * secondsPerBeat);
                    this.nextNoteTime += note[1] * secondsPerBeat;
                    this.noteIndex++;
                }
                this.timer = setTimeout(() => this.scheduler(), 25);
            }
        };

        // --- 2. Theme Engine (Updated with Radical Themes) ---
        const THEMES = [
            { name: 'NEON', id: '', colors: [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'], ghostAlpha: 0.2, grid: 'rgba(255,255,255,0.05)' },
            { name: 'VAPOR', id: 'theme-vaporwave', colors: [null, '#ff71ce', '#01cdfe', '#05ffa1', '#b967ff', '#fffb96', '#ff71ce', '#01cdfe'], ghostAlpha: 0.3, grid: 'rgba(0, 255, 255, 0.1)' },
            { name: 'GAMEBOY', id: 'theme-gameboy', colors: [null, '#0f380f', '#0f380f', '#0f380f', '#0f380f', '#0f380f', '#0f380f', '#0f380f'], ghostAlpha: 0.2, grid: 'rgba(15, 56, 15, 0.3)' },
            { name: 'MATRIX', id: 'theme-matrix', colors: [null, '#00FF00', '#00FF00', '#00FF00', '#00FF00', '#00FF00', '#00FF00', '#00FF00'], ghostAlpha: 0.15, grid: '#003300' },
            { name: 'CANDY', id: 'theme-candy', colors: [null, '#FF9AA2', '#FFB7B2', '#FFDAC1', '#E2F0CB', '#B5EAD7', '#C7CEEA', '#F6EAC2'], ghostAlpha: 0.3, grid: 'rgba(0,0,0,0.05)' },
            { name: 'PRINT', id: 'theme-blueprint', colors: [null, '#fff', '#fff', '#fff', '#fff', '#fff', '#fff', '#fff'], ghostAlpha: 0.1, grid: 'rgba(255, 255, 255, 0.2)' },
            { name: 'DRACULA', id: 'theme-dracula', colors: [null, '#bd93f9', '#ff79c6', '#50fa7b', '#8be9fd', '#ffb86c', '#f1fa8c', '#ff5555'], ghostAlpha: 0.2, grid: 'rgba(98, 114, 164, 0.2)' },
            { name: 'CYBERPUNK GLITCH', id: 'theme-glitch', colors: [null, '#ff00ff', '#00ffff', '#9d00ff', '#ff0077', '#00ff77', '#ffff00', '#ff8800'], ghostAlpha: 0.15, grid: 'rgba(255, 0, 255, 0.3)' },
            { name: 'LAVA FLOW', id: 'theme-lava', colors: [null, '#ff0000', '#ff4500', '#ff8c00', '#ffbb00', '#990000', '#660000', '#330000'], ghostAlpha: 0.4, grid: 'rgba(255, 120, 0, 0.2)' },
            { name: '8-BIT RETRO', id: 'theme-8bit', colors: [null, '#ff0000', '#0000ff', '#00ff00', '#ffff00', '#ff00ff', '#00ffff', '#ffffff'], ghostAlpha: 0.1, grid: 'rgba(0, 0, 0, 0.15)' },
            { name: 'DARK MODE PRO', id: 'theme-darkpro', colors: [null, '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#a3a3a3', '#e5e5e5'], ghostAlpha: 0.1, grid: 'rgba(59, 130, 246, 0.05)' }
        ];

        let themeIndex = 0;
        let currentTheme = THEMES[0];

        // --- 3. Game Logic ---
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-canvas');
        const nextContext = nextCanvas.getContext('2d');
        const holdCanvas = document.getElementById('hold-canvas');
        const holdContext = holdCanvas.getContext('2d');

        context.scale(20, 20); 
        nextContext.scale(15, 15); 
        holdContext.scale(15, 15);

        const arena = createMatrix(12, 20);
        const player = { pos: {x: 0, y: 0}, matrix: null, next: null, nextType: null, hold: null, activeType: null, canHold: true, score: 0 };

        let dropCounter = 0;
        let dropInterval = 1000;
        let normalSpeed = 1000;
        const fastSpeed = 25; 
        let isFastDropping = false;
        let lastTime = 0;
        let isPaused = true;
        let isGameOver = false;
        let score = 0;
        let level = 1;
        let highScore = localStorage.getItem('tetris_hs_final') || 0;
        document.getElementById('high-score').innerText = highScore;

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        function createPiece(type) {
            if (type === 'I') return [[0, 1, 0, 0],[0, 1, 0, 0],[0, 1, 0, 0],[0, 1, 0, 0]];
            if (type === 'L') return [[0, 2, 0],[0, 2, 0],[0, 2, 2]];
            if (type === 'J') return [[0, 3, 0],[0, 3, 0],[3, 3, 0]];
            if (type === 'O') return [[4, 4],[4, 4]];
            if (type === 'Z') return [[5, 5, 0],[0, 5, 5],[0, 0, 0]];
            if (type === 'S') return [[0, 6, 6],[6, 6, 0],[0, 0, 0]];
            if (type === 'T') return [[0, 7, 0],[7, 7, 7],[0, 0, 0]];
        }

        function drawMatrix(matrix, offset, ctx, isGhost = false) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = currentTheme.colors[value];
                        
                        if (currentTheme.name === '8-BIT RETRO') {
                            ctx.strokeStyle = '#000';
                            ctx.lineWidth = 0.1;
                            ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                            ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                        }
                        
                        else if (isGhost) {
                            ctx.globalAlpha = currentTheme.ghostAlpha;
                            ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                            ctx.globalAlpha = 1.0;
                            ctx.lineWidth = 0.05;
                            ctx.strokeStyle = currentTheme.colors[value];
                            ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                        } else {
                            ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                            
                            // Specific border/effect styles for themes
                            if (currentTheme.name === 'MATRIX') {
                                ctx.fillStyle = 'rgba(0,20,0,0.5)';
                                ctx.font = '0.8px monospace';
                                ctx.fillText(String.fromCharCode(0x30A0 + Math.random() * 96), x + offset.x+0.1, y+offset.y+0.8);
                            } else if (currentTheme.name === 'PRINT') {
                                ctx.lineWidth = 0.05; ctx.strokeStyle = '#003366';
                                ctx.strokeRect(x+offset.x, y+offset.y, 1, 1);
                                ctx.beginPath(); ctx.moveTo(x+offset.x, y+offset.y); ctx.lineTo(x+offset.x+1, y+offset.y+1); ctx.stroke();
                            } else if (currentTheme.name === 'GAMEBOY') {
                                ctx.lineWidth = 0.1; ctx.strokeStyle = '#9bbc0f';
                                ctx.strokeRect(x+offset.x, y+offset.y, 1, 1);
                            } else {
                                // Default subtle border
                                ctx.lineWidth = 0.05; ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                                ctx.strokeRect(x+offset.x, y+offset.y, 1, 1);
                            }
                        }
                    }
                });
            });
        }

        function draw() {
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.lineWidth = 0.04;
            context.strokeStyle = currentTheme.grid;
            
            // Draw grid lines
            for (let x=0; x<=12; x++) { context.beginPath(); context.moveTo(x,0); context.lineTo(x,20); context.stroke(); }
            for (let y=0; y<=20; y++) { context.beginPath(); context.moveTo(0,y); context.lineTo(12,y); context.stroke(); }

            drawMatrix(arena, {x: 0, y: 0}, context);
            if (player.matrix) {
                // Draw Ghost Piece
                const ghost = {pos: {...player.pos}, matrix: player.matrix};
                while (!collide(arena, ghost)) ghost.pos.y++;
                ghost.pos.y--;
                drawMatrix(player.matrix, ghost.pos, context, true);
                
                // Draw Active Piece
                drawMatrix(player.matrix, player.pos, context);
            }
        }

        function drawPreview(ctx, type) {
            ctx.clearRect(0, 0, 80, 80);
            if (type) {
                const matrix = createPiece(type);
                const centerOffset = (5 - matrix[0].length) / 2;
                drawMatrix(matrix, {x: centerOffset, y: 1}, ctx);
            }
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse()); else matrix.reverse();
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            if (player.next === null) {
                player.nextType = pieces[pieces.length * Math.random() | 0];
                player.next = createPiece(player.nextType);
            }
            player.activeType = player.nextType;
            player.matrix = player.next;
            player.nextType = pieces[pieces.length * Math.random() | 0];
            player.next = createPiece(player.nextType);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            if (collide(arena, player)) {
                isGameOver = true;
                isPaused = true;
                document.getElementById('overlay-title').innerText = "GAME OVER";
                document.getElementById('start-btn').innerText = "RESTART";
                document.getElementById('overlay').style.display = 'flex';
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('tetris_hs_final', highScore);
                    document.getElementById('high-score').innerText = highScore;
                }
            }
            drawPreview(nextContext, player.nextType);
            drawPreview(holdContext, player.hold);
            const hb = document.getElementById('btn-hold');
            if(!player.canHold) hb.classList.add('disabled-hold'); else hb.classList.remove('disabled-hold');
        }

        function playerHold() {
            if (!player.canHold || isPaused || isGameOver) return;
            if (player.hold === null) {
                player.hold = player.activeType;
                playerReset();
            } else {
                const temp = player.activeType;
                player.activeType = player.hold;
                player.hold = temp;
                player.matrix = createPiece(player.activeType);
                player.pos.y = 0;
                player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            }
            player.canHold = false;
            drawPreview(holdContext, player.hold);
            document.getElementById('btn-hold').classList.add('disabled-hold');
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
                player.canHold = true;
                document.getElementById('btn-hold').classList.remove('disabled-hold');
            }
            dropCounter = 0;
        }

        function playerMove(offset) {
            player.pos.x += offset;
            if (collide(arena, player)) player.pos.x -= offset;
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) if (arena[y][x] === 0) continue outer;
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                score += rowCount * 10;
                rowCount *= 2;
            }
        }

        function updateScore() {
            document.getElementById('score').innerText = score;
            level = Math.floor(score / 500) + 1;
            document.getElementById('level').innerText = level;
            normalSpeed = Math.max(100, 1000 - (level * 50));
            if (!isFastDropping) dropInterval = normalSpeed;
        }

        function update(time = 0) {
            if (!isPaused && !isGameOver) {
                if (!lastTime) lastTime = time; 
                const deltaTime = time - lastTime;
                lastTime = time;
                
                dropCounter += deltaTime;
                if (dropCounter > dropInterval) playerDrop();
                draw();
                requestAnimationFrame(update);
            }
        }

        // --- Input & Interaction ---
        document.getElementById('theme-btn').addEventListener('click', () => {
            if(currentTheme.id) document.body.classList.remove(currentTheme.id);
            themeIndex = (themeIndex + 1) % THEMES.length;
            currentTheme = THEMES[themeIndex];
            if(currentTheme.id) document.body.classList.add(currentTheme.id);
            document.getElementById('theme-btn').innerText = `THEME: ${currentTheme.name}`;
            draw();
            drawPreview(nextContext, player.nextType);
            drawPreview(holdContext, player.hold);
        });

        document.getElementById('music-btn').addEventListener('click', () => SoundSystem.toggle());

        function bindBtn(id, action, holdAction = false) {
            const btn = document.getElementById(id);
            const start = (e) => {
                e.preventDefault();
                if(SoundSystem.enabled) SoundSystem.resume(); 
                if (!isPaused && !isGameOver) {
                    if (holdAction) { isFastDropping = true; dropInterval = fastSpeed; btn.classList.add('active-state'); }
                    else action();
                }
            };
            const end = (e) => {
                e.preventDefault();
                if (holdAction) { isFastDropping = false; dropInterval = normalSpeed; btn.classList.remove('active-state'); }
            };
            btn.addEventListener('mousedown', start, {passive: false});
            btn.addEventListener('touchstart', start, {passive: false});
            if (holdAction) ['mouseup','mouseleave','touchend'].forEach(evt => btn.addEventListener(evt, end));
        }

        bindBtn('btn-left', () => playerMove(-1));
        bindBtn('btn-right', () => playerMove(1));
        bindBtn('btn-down', () => playerDrop());
        bindBtn('btn-rotate', () => playerRotate(1));
        bindBtn('btn-hold', () => playerHold());
        bindBtn('btn-drop', null, true);

        document.addEventListener('keydown', event => {
            if (isPaused) return;
            if(SoundSystem.enabled) SoundSystem.resume();
            if (event.keyCode === 37) playerMove(-1);
            else if (event.keyCode === 39) playerMove(1);
            else if (event.keyCode === 40) { isFastDropping = true; dropInterval = fastSpeed; }
            else if (event.keyCode === 38) playerRotate(1);
            else if (event.keyCode === 16 || event.keyCode === 67) playerHold(); // Shift or C
            else if (event.keyCode === 32) { // Spacebar for hard drop
                let linesCleared = 0;
                while (!collide(arena, player)) {
                    player.pos.y++;
                    linesCleared++;
                }
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
                player.canHold = true;
            }
        });
        document.addEventListener('keyup', e => { if (e.keyCode === 40) { isFastDropping = false; dropInterval = normalSpeed; }});

        document.getElementById('start-btn').addEventListener('click', (e) => {
            e.preventDefault();
            
            document.getElementById('overlay').style.display = 'none';
            
            arena.forEach(row => row.fill(0));
            score = 0; level = 1;
            player.hold = null; player.canHold = true; player.next = null;
            updateScore();
            isGameOver = false;
            isPaused = false;
            
            SoundSystem.init();
            if(SoundSystem.enabled) SoundSystem.start();
            
            playerReset();
            lastTime = 0; 
            requestAnimationFrame(update);
        });

        // Initial setup
        playerReset();
        draw();
        drawPreview(nextContext, player.nextType);
    </script>
</body>
</html>
