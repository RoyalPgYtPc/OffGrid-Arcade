<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Tetris Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #1a1a2e;
            --grid-color: #16213e;
            --accent: #e94560;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--bg-color);
            color: white;
            overflow: hidden; /* Prevent scrolling on mobile */
            touch-action: none; /* Disable browser touch actions */
        }

        /* Scanline effect */
        .screen-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .game-canvas {
            image-rendering: pixelated; /* Sharp pixels */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: rgba(0, 0, 0, 0.8);
            border: 2px solid #333;
        }

        /* Custom button styling for touch */
        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.1s;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .control-btn:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.95);
        }
        
        .d-pad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 160px;
        }

        /* Flash animation for line clear */
        @keyframes flash {
            0% { background-color: white; }
            100% { background-color: transparent; }
        }
        .flash-effect {
            animation: flash 0.1s;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-between p-2 sm:p-4">

    <!-- Header / Score -->
    <div class="w-full max-w-md flex justify-between items-end mb-2 z-10">
        <div class="flex flex-col gap-1">
            <h1 class="text-yellow-400 text-sm mb-1 tracking-widest shadow-black drop-shadow-md">TETRIS</h1>
            <div class="text-xs text-gray-400">SCORE</div>
            <div id="score" class="text-xl text-white">0</div>
        </div>
        <div class="flex flex-col items-end gap-1">
            <div class="text-xs text-gray-400">NEXT</div>
            <canvas id="next-canvas" width="80" height="80" class="bg-black border border-gray-700 rounded"></canvas>
        </div>
    </div>

    <!-- Game Board Area -->
    <div class="relative screen-container flex-grow flex items-center justify-center w-full max-w-md mb-2">
        <canvas id="tetris" width="240" height="400" class="game-canvas max-h-full max-w-full rounded"></canvas>
        
        <!-- Start/Pause Overlay -->
        <div id="overlay" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-20">
            <h2 id="overlay-title" class="text-3xl text-yellow-400 mb-4 animate-pulse">START</h2>
            <p id="high-score-display" class="text-xs text-gray-300 mb-8">HIGH SCORE: 0</p>
            <button id="start-btn" class="px-6 py-3 bg-red-600 text-white border-b-4 border-red-800 active:border-b-0 active:translate-y-1 rounded font-bold text-sm">
                PLAY GAME
            </button>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div class="w-full max-w-md pb-4 z-10 flex justify-between items-end gap-4 select-none touch-none">
        
        <!-- D-Pad (Left, Down, Right, Rotate on Up) -->
        <div class="d-pad-grid">
            <div><!-- Empty top-left --></div>
            <button class="control-btn rounded-full w-14 h-14 flex items-center justify-center" id="btn-rotate">
                <i class="fas fa-undo text-xl transform rotate-180"></i>
            </button>
            <div><!-- Empty top-right --></div>

            <button class="control-btn rounded-full w-14 h-14 flex items-center justify-center" id="btn-left">
                <i class="fas fa-chevron-left text-xl"></i>
            </button>
            <button class="control-btn rounded-full w-14 h-14 flex items-center justify-center" id="btn-down">
                <i class="fas fa-chevron-down text-xl"></i>
            </button>
            <button class="control-btn rounded-full w-14 h-14 flex items-center justify-center" id="btn-right">
                <i class="fas fa-chevron-right text-xl"></i>
            </button>
        </div>

        <!-- Action Button (Hard Drop) -->
        <div class="flex flex-col items-center gap-2">
             <span class="text-[10px] text-gray-500 font-bold tracking-widest">DROP</span>
            <button class="control-btn rounded-full w-20 h-20 bg-red-500/20 border-red-500/50 flex items-center justify-center active:bg-red-500/40" id="btn-drop">
                <div class="w-12 h-12 rounded-full border-2 border-red-400 flex items-center justify-center">
                    <i class="fas fa-arrow-down text-red-400 text-xl"></i>
                </div>
            </button>
        </div>
    </div>

    <script>
        /**
         * Tetris Mobile Port
         * Uses HTML5 Canvas for rendering.
         */

        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-canvas');
        const nextContext = nextCanvas.getContext('2d');
        
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const scoreElement = document.getElementById('score');
        const highScoreDisplay = document.getElementById('high-score-display');

        // Game Constants
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 24; // Internal resolution
        
        // Scale context to fit canvas size
        // We set canvas width/height in HTML to 240x400 (10*24 x 20*24)
        context.scale(1, 1); 
        nextContext.scale(1, 1);

        // Colors for pieces (Standard Tetris colors)
        const COLORS = [
            null,
            '#FF0D72', // T - Purple/Pink
            '#0DC2FF', // I - Cyan
            '#0DFF72', // S - Green
            '#F538FF', // Z - Magenta/Reddish
            '#FF8E0D', // L - Orange
            '#FFE138', // J - Yellow
            '#3877FF', // O - Blue
        ];

        // The 7 Tetrominoes
        const PIECES = 'ILJOTSZ';
        
        // Game State
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let score = 0;
        let highScore = localStorage.getItem('tetris_highscore') || 0;
        let isPaused = true;
        let isGameOver = false;

        // The Arena (Game Grid)
        const arena = createMatrix(COLS, ROWS);

        // Player Object
        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            next: null,
            score: 0,
        };

        highScoreDisplay.innerText = `HIGH SCORE: ${highScore}`;

        // --- Core Logic ---

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'I') {
                return [
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 2, 0],
                    [0, 2, 0],
                    [0, 2, 2],
                ];
            } else if (type === 'J') {
                return [
                    [0, 3, 0],
                    [0, 3, 0],
                    [3, 3, 0],
                ];
            } else if (type === 'O') {
                return [
                    [4, 4],
                    [4, 4],
                ];
            } else if (type === 'Z') {
                return [
                    [5, 5, 0],
                    [0, 5, 5],
                    [0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 6, 6],
                    [6, 6, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'T') {
                return [
                    [0, 7, 0],
                    [7, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        function drawMatrix(matrix, offset, ctx = context) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        // Main block color
                        ctx.fillStyle = COLORS[value];
                        ctx.fillRect((x + offset.x) * BLOCK_SIZE, 
                                     (y + offset.y) * BLOCK_SIZE, 
                                     BLOCK_SIZE, BLOCK_SIZE);
                        
                        // Bevel/3D effect
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                        ctx.strokeRect((x + offset.x) * BLOCK_SIZE, 
                                       (y + offset.y) * BLOCK_SIZE, 
                                       BLOCK_SIZE, BLOCK_SIZE);
                        
                        // Inner shadow
                        ctx.fillStyle = 'rgba(0,0,0,0.1)';
                        ctx.fillRect((x + offset.x) * BLOCK_SIZE + 2, 
                                     (y + offset.y) * BLOCK_SIZE + 2, 
                                     BLOCK_SIZE - 4, BLOCK_SIZE - 4);
                    }
                });
            });
        }

        function draw() {
            // Clear board
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines (optional aesthetic)
            context.strokeStyle = '#111';
            context.lineWidth = 1;
            for(let i=0; i<COLS; i++) {
                context.beginPath();
                context.moveTo(i*BLOCK_SIZE, 0);
                context.lineTo(i*BLOCK_SIZE, canvas.height);
                context.stroke();
            }
            for(let i=0; i<ROWS; i++) {
                context.beginPath();
                context.moveTo(0, i*BLOCK_SIZE);
                context.lineTo(canvas.width, i*BLOCK_SIZE);
                context.stroke();
            }

            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawNext() {
            nextContext.fillStyle = '#000';
            nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            
            if (player.next) {
                // Center the piece in the preview box (80x80 roughly 3.3 blocks)
                const offsetX = (80/BLOCK_SIZE - player.next[0].length) / 2;
                const offsetY = (80/BLOCK_SIZE - player.next.length) / 2;
                
                // Temporarily scale down next piece if it's big
                drawMatrix(player.next, {x: offsetX, y: offsetY}, nextContext);
            }
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--; // Back up one step
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
            // Subtle shake effect
            canvas.style.transform = `translateY(2px)`;
            setTimeout(() => canvas.style.transform = 'none', 50);
        }

        function playerMove(offset) {
            player.pos.x += offset;
            if (collide(arena, player)) {
                player.pos.x -= offset;
            }
        }

        function playerReset() {
            if (player.next === null) {
                 player.next = createPiece(PIECES[PIECES.length * Math.random() | 0]);
            }
            player.matrix = player.next;
            player.next = createPiece(PIECES[PIECES.length * Math.random() | 0]);
            
            // Draw the new next piece
            drawNext();

            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            if (collide(arena, player)) {
                // Game Over
                isGameOver = true;
                isPaused = true;
                if (player.score > highScore) {
                    highScore = player.score;
                    localStorage.setItem('tetris_highscore', highScore);
                }
                overlayTitle.innerText = "GAME OVER";
                highScoreDisplay.innerText = `HIGH SCORE: ${highScore}`;
                startBtn.innerText = "TRY AGAIN";
                overlay.classList.remove('hidden');
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] &&
                        arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length -1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }

                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 10;
                rowCount *= 2;
                
                // Visual flash for cleared line
                canvas.classList.add('flash-effect');
                setTimeout(() => canvas.classList.remove('flash-effect'), 100);
            }
        }

        function updateScore() {
            scoreElement.innerText = player.score;
            // Speed up game as score increases
            dropInterval = Math.max(100, 1000 - (player.score / 50));
        }

        function update(time = 0) {
            if (!isPaused && !isGameOver) {
                const deltaTime = time - lastTime;
                lastTime = time;

                dropCounter += deltaTime;
                if (dropCounter > dropInterval) {
                    playerDrop();
                }

                draw();
                requestAnimationFrame(update);
            }
        }

        // --- Controls ---

        // Keyboard
        document.addEventListener('keydown', event => {
            if (isPaused) return;
            if (event.keyCode === 37) { // Left
                playerMove(-1);
            } else if (event.keyCode === 39) { // Right
                playerMove(1);
            } else if (event.keyCode === 40) { // Down
                playerDrop();
            } else if (event.keyCode === 38) { // Up (Rotate)
                playerRotate(1);
            } else if (event.keyCode === 32) { // Space (Drop)
                playerHardDrop();
            }
        });

        // Touch / Button Bindings
        function bindBtn(id, action) {
            const btn = document.getElementById(id);
            // Support both mouse and touch, prevent default to stop scrolling
            ['mousedown', 'touchstart'].forEach(evt => 
                btn.addEventListener(evt, (e) => {
                    e.preventDefault();
                    if (!isPaused && !isGameOver) action();
                }, {passive: false})
            );
        }

        bindBtn('btn-left', () => playerMove(-1));
        bindBtn('btn-right', () => playerMove(1));
        bindBtn('btn-down', () => playerDrop());
        bindBtn('btn-rotate', () => playerRotate(1));
        bindBtn('btn-drop', () => playerHardDrop());

        // Game Flow
        function startGame() {
            // Reset Arena
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.next = null;
            updateScore();
            isGameOver = false;
            isPaused = false;
            overlay.classList.add('hidden');
            
            playerReset();
            update();
        }

        startBtn.addEventListener('click', startGame);

        // Initial Draw
        playerReset();
        draw();
        drawNext();

    </script>
</body>
</html>
