<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris Mobile v3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=VT323&display=swap');

        /* Theme Variables - Default (Neon) */
        :root {
            --bg-body: #0f0f1a;
            --bg-canvas: rgba(0, 0, 0, 0.9);
            --grid-line: rgba(255, 255, 255, 0.1);
            --text-main: #fff;
            --text-accent: #ff0055;
            --ui-border: rgba(255, 255, 255, 0.15);
            --btn-bg: rgba(255, 255, 255, 0.08);
            --font-main: 'Chakra Petch', sans-serif;
        }

        /* Retro Gameboy Theme */
        body.theme-retro {
            --bg-body: #8b9c48;
            --bg-canvas: #9bbc0f;
            --grid-line: rgba(15, 56, 15, 0.2);
            --text-main: #0f380f;
            --text-accent: #306230;
            --ui-border: #306230;
            --btn-bg: rgba(15, 56, 15, 0.1);
            --font-main: 'VT323', monospace;
        }

        /* Classic Theme */
        body.theme-classic {
            --bg-body: #2c3e50;
            --bg-canvas: #000000;
            --grid-line: #333;
            --text-main: #ecf0f1;
            --text-accent: #f1c40f;
            --ui-border: #7f8c8d;
            --btn-bg: rgba(255, 255, 255, 0.1);
            --font-main: sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-body);
            color: var(--text-main);
            overflow: hidden;
            touch-action: none;
            height: 100dvh;
            width: 100vw;
            transition: background-color 0.3s, color 0.3s;
        }

        .game-canvas {
            image-rendering: pixelated;
            background-color: var(--bg-canvas);
            border: 2px solid var(--ui-border);
            max-height: 100%;
            max-width: 100%;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .control-btn {
            background: var(--btn-bg);
            border: 1px solid var(--ui-border);
            backdrop-filter: blur(4px);
            transition: transform 0.05s, background 0.05s;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            color: var(--text-main);
        }
        
        .control-btn:active, .control-btn.active-state {
            background: var(--text-accent);
            color: var(--bg-body);
            transform: scale(0.92);
            border-color: var(--text-accent);
        }

        .d-pad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 150px;
        }

        /* Scanlines only visible on Neon theme */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 5;
            opacity: 1;
        }
        body.theme-retro .scanlines, body.theme-classic .scanlines {
            opacity: 0.1; /* Faint on other themes */
        }
        
        .disabled-hold {
            opacity: 0.3;
        }

        .theme-btn {
            font-size: 0.7rem;
            padding: 4px 8px;
            border: 1px solid var(--ui-border);
            border-radius: 4px;
            margin-bottom: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-2">

    <!-- Top Bar -->
    <div class="w-full max-w-lg flex justify-between items-start h-[15dvh] pt-2 z-10">
        <!-- Hold Box -->
        <div class="flex flex-col items-center w-20">
            <div class="text-[10px] opacity-70 font-bold mb-1 tracking-wider">HOLD</div>
            <canvas id="hold-canvas" width="80" height="80" class="game-canvas rounded w-[50px] h-[50px] sm:w-[60px] sm:h-[60px]"></canvas>
        </div>

        <!-- Center Info -->
        <div class="flex flex-col items-center justify-start pt-1">
            <button id="theme-btn" class="theme-btn">THEME: NEON</button>
            <div class="text-3xl font-bold tracking-widest mt-1" id="score">0</div>
            <div class="text-[10px] opacity-60">LEVEL <span id="level">1</span></div>
        </div>

        <!-- Next Box -->
        <div class="flex flex-col items-center w-20">
            <div class="text-[10px] opacity-70 font-bold mb-1 tracking-wider">NEXT</div>
            <canvas id="next-canvas" width="80" height="80" class="game-canvas rounded w-[50px] h-[50px] sm:w-[60px] sm:h-[60px]"></canvas>
        </div>
    </div>

    <!-- Game Board -->
    <div class="relative flex-1 min-h-0 w-full flex items-center justify-center py-2">
        <div class="relative h-full w-full flex items-center justify-center">
            <canvas id="tetris" width="240" height="400" class="game-canvas"></canvas>
            <div class="scanlines"></div>
            
            <!-- Pause/Start Overlay -->
            <div id="overlay" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center z-20 rounded border-2 border-[var(--ui-border)]">
                <h2 id="overlay-title" class="text-4xl font-bold mb-2 tracking-tighter text-[var(--text-accent)]">TETRIS</h2>
                <div class="text-xs opacity-70 mb-8 font-mono">HIGH SCORE: <span id="high-score">0</span></div>
                <button id="start-btn" class="px-8 py-4 bg-[var(--text-accent)] text-[var(--bg-body)] font-bold rounded shadow-lg active:scale-95 transition-transform border border-white/20">
                    START GAME
                </button>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="w-full max-w-lg h-[25dvh] grid grid-cols-2 gap-4 pb-2 select-none z-10">
        
        <!-- Left Side: D-Pad -->
        <div class="flex items-center justify-center">
            <div class="d-pad-grid">
                <!-- Row 1 -->
                <button class="control-btn rounded-lg h-12 flex items-center justify-center" id="btn-hold">
                    <span class="text-[10px] font-bold">HOLD</span>
                </button>
                <button class="control-btn rounded-lg h-12 flex items-center justify-center" id="btn-rotate">
                    <i class="fas fa-undo transform rotate-180 text-sm"></i>
                </button>
                <div class="h-12"></div> 

                <!-- Row 2 -->
                <button class="control-btn rounded-lg h-12 flex items-center justify-center" id="btn-left">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button class="control-btn rounded-lg h-12 flex items-center justify-center" id="btn-down">
                    <i class="fas fa-chevron-down"></i>
                </button>
                <button class="control-btn rounded-lg h-12 flex items-center justify-center" id="btn-right">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- Right Side: Fast Drop (Hold to Speed Up) -->
        <div class="flex items-center justify-center pr-4">
            <button class="control-btn rounded-full w-24 h-24 flex flex-col items-center justify-center gap-1" id="btn-drop">
                <i class="fas fa-angle-double-down text-3xl"></i>
                <span class="text-[10px] font-bold tracking-wider">FAST</span>
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-canvas');
        const nextContext = nextCanvas.getContext('2d');
        const holdCanvas = document.getElementById('hold-canvas');
        const holdContext = holdCanvas.getContext('2d');

        // UI Elements
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const highScoreElement = document.getElementById('high-score');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const startBtn = document.getElementById('start-btn');
        const holdBtn = document.getElementById('btn-hold');
        const themeBtn = document.getElementById('theme-btn');
        const body = document.body;

        // Scale setup
        context.scale(20, 20); 
        nextContext.scale(15, 15); 
        holdContext.scale(15, 15);

        // --- Themes ---
        const THEMES = [
            {
                name: 'NEON',
                id: '', // Default class
                colors: [
                    null,
                    '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'
                ],
                grid: 'rgba(255,255,255,0.05)'
            },
            {
                name: 'RETRO',
                id: 'theme-retro',
                colors: [
                    null,
                    '#0f380f', '#0f380f', '#0f380f', '#0f380f', '#0f380f', '#0f380f', '#0f380f' 
                ],
                grid: 'rgba(15, 56, 15, 0.3)'
            },
            {
                name: 'CLASSIC',
                id: 'theme-classic',
                colors: [
                    null,
                    'cyan', 'blue', 'orange', 'yellow', 'green', 'purple', 'red'
                ],
                grid: '#333'
            }
        ];
        
        let themeIndex = 0;
        let currentColors = THEMES[0].colors;

        themeBtn.addEventListener('click', () => {
            // Remove old theme class
            if(THEMES[themeIndex].id) body.classList.remove(THEMES[themeIndex].id);
            
            // Cycle
            themeIndex = (themeIndex + 1) % THEMES.length;
            
            // Add new theme class
            if(THEMES[themeIndex].id) body.classList.add(THEMES[themeIndex].id);
            
            // Update internal state
            currentColors = THEMES[themeIndex].colors;
            themeBtn.innerText = `THEME: ${THEMES[themeIndex].name}`;
            
            draw();
            drawPreviews();
        });

        // --- Game State ---
        const arena = createMatrix(12, 20);
        
        let dropCounter = 0;
        let dropInterval = 1000;
        let normalSpeed = 1000;
        const fastSpeed = 50; // Speed when holding button
        let isFastDropping = false;

        let lastTime = 0;
        let isPaused = true;
        let isGameOver = false;
        let score = 0;
        let level = 1;
        let highScore = localStorage.getItem('tetris_hs_v3') || 0;
        highScoreElement.innerText = highScore;

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            next: null,
            hold: null,
            canHold: true,
            score: 0,
        };

        // --- Core Functions ---

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'I') {
                return [
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 2, 0],
                    [0, 2, 0],
                    [0, 2, 2],
                ];
            } else if (type === 'J') {
                return [
                    [0, 3, 0],
                    [0, 3, 0],
                    [3, 3, 0],
                ];
            } else if (type === 'O') {
                return [
                    [4, 4],
                    [4, 4],
                ];
            } else if (type === 'Z') {
                return [
                    [5, 5, 0],
                    [0, 5, 5],
                    [0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 6, 6],
                    [6, 6, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'T') {
                return [
                    [0, 7, 0],
                    [7, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        function drawGrid(ctx, width, height) {
            ctx.lineWidth = 0.05;
            ctx.strokeStyle = THEMES[themeIndex].grid;
            
            // Vertical lines
            for (let x = 0; x <= width; x++) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            // Horizontal lines
            for (let y = 0; y <= height; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        }

        function drawMatrix(matrix, offset, ctx) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = currentColors[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        // Retro Theme Logic (Pixel style)
                        if (themeIndex === 1) { 
                             ctx.lineWidth = 0.1;
                             ctx.strokeStyle = '#9bbc0f'; // Gap color
                             ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                             
                             // Inner pixel detail
                             ctx.fillStyle = 'rgba(0,0,0,0.2)';
                             ctx.fillRect(x + offset.x + 0.2, y + offset.y + 0.2, 0.6, 0.6);
                        } 
                        // Modern/Neon Logic
                        else {
                            ctx.lineWidth = 0.05;
                            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                            ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                            
                            ctx.fillStyle = 'rgba(0,0,0,0.15)';
                            ctx.fillRect(x + offset.x + 0.1, y + offset.y + 0.1, 0.8, 0.8);
                        }
                    }
                });
            });
        }

        function draw() {
            // Clear
            context.clearRect(0, 0, canvas.width, canvas.height); // Use clearRect to let CSS background show if needed
            
            // Draw Grid
            drawGrid(context, 12, 20);

            drawMatrix(arena, {x: 0, y: 0}, context);
            drawMatrix(player.matrix, player.pos, context);
        }

        function drawPreviews() {
            // Next
            nextContext.clearRect(0,0, nextCanvas.width, nextCanvas.height);
            if (player.next) {
                const centerOffset = (5 - player.next[0].length) / 2;
                drawMatrix(player.next, {x: centerOffset, y: 1}, nextContext);
            }

            // Hold
            holdContext.clearRect(0,0, holdCanvas.width, holdCanvas.height);
            if (player.hold) {
                const centerOffset = (5 - player.hold[0].length) / 2;
                drawMatrix(player.hold, {x: centerOffset, y: 1}, holdContext);
            }

            // UI Feedback
            if (!player.canHold) {
                holdBtn.classList.add('disabled-hold');
                holdBtn.style.opacity = "0.3";
            } else {
                holdBtn.classList.remove('disabled-hold');
                holdBtn.style.opacity = "1";
            }
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
                player.canHold = true;
                drawPreviews();
                
                // If we were fast dropping, we want to stay fast dropping 
                // for the next piece until button is released, 
                // BUT usually in tetris, locking a piece might reset drop delay slightly.
                // For this simple implementation, we keep dropInterval as is.
            }
            dropCounter = 0;
        }

        function playerMove(offset) {
            player.pos.x += offset;
            if (collide(arena, player)) {
                player.pos.x -= offset;
            }
        }

        function playerHold() {
            if (!player.canHold || isPaused || isGameOver) return;

            if (player.hold === null) {
                player.hold = player.matrix;
                playerReset(true);
            } else {
                const temp = player.matrix;
                player.matrix = player.hold;
                player.hold = temp;
                player.pos.y = 0;
                player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            }
            
            player.canHold = false;
            drawPreviews();
        }

        function playerReset(fromHold = false) {
            const pieces = 'ILJOTSZ';
            if (!fromHold) {
                if (player.next === null) {
                    player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
                }
                player.matrix = player.next;
                player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
            }
            
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            if (collide(arena, player)) {
                isGameOver = true;
                isPaused = true;
                overlayTitle.innerText = "GAME OVER";
                startBtn.innerText = "RESTART";
                overlay.classList.remove('hidden');
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('tetris_hs_v3', highScore);
                    highScoreElement.innerText = highScore;
                }
            }
            drawPreviews();
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] &&
                        arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length -1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }

                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                score += rowCount * 10;
                rowCount *= 2;
            }
        }

        function updateScore() {
            scoreElement.innerText = score;
            level = Math.floor(score / 200) + 1;
            levelElement.innerText = level;
            
            // Calculate normal speed based on level
            normalSpeed = Math.max(100, 1000 - (level * 50));
            
            // If we are NOT holding the drop button, update current interval
            if (!isFastDropping) {
                dropInterval = normalSpeed;
            }
        }

        function update(time = 0) {
            if (!isPaused && !isGameOver) {
                const deltaTime = time - lastTime;
                lastTime = time;

                dropCounter += deltaTime;
                if (dropCounter > dropInterval) {
                    playerDrop();
                }

                draw();
                requestAnimationFrame(update);
            }
        }

        // --- Logic for Fast Drop (Soft Drop) ---
        function startFastDrop() {
            if(isPaused || isGameOver) return;
            isFastDropping = true;
            dropInterval = fastSpeed;
            document.getElementById('btn-drop').classList.add('active-state');
        }

        function stopFastDrop() {
            isFastDropping = false;
            dropInterval = normalSpeed;
            document.getElementById('btn-drop').classList.remove('active-state');
        }

        // --- Inputs ---

        // Keyboard
        document.addEventListener('keydown', event => {
            if (isPaused) return;
            if (event.keyCode === 37) playerMove(-1);
            else if (event.keyCode === 39) playerMove(1);
            else if (event.keyCode === 40) startFastDrop(); // Down arrow acts as soft drop
            else if (event.keyCode === 38) playerRotate(1);
            else if (event.keyCode === 16 || event.keyCode === 67) playerHold();
        });
        
        document.addEventListener('keyup', event => {
            if (event.keyCode === 40) stopFastDrop();
        });

        // Touch / Mouse Bindings
        function bindBtn(id, action, holdAction = false) {
            const btn = document.getElementById(id);
            
            const handleStart = (e) => {
                e.preventDefault();
                if (!isPaused && !isGameOver) {
                    if(holdAction) {
                        startFastDrop();
                    } else {
                        action();
                    }
                }
            };

            const handleEnd = (e) => {
                e.preventDefault(); // Prevent ghost mouse events
                if(holdAction) stopFastDrop();
            };

            btn.addEventListener('mousedown', handleStart, {passive: false});
            btn.addEventListener('touchstart', handleStart, {passive: false});

            if (holdAction) {
                btn.addEventListener('mouseup', handleEnd);
                btn.addEventListener('mouseleave', handleEnd);
                btn.addEventListener('touchend', handleEnd);
            }
        }

        bindBtn('btn-left', () => playerMove(-1));
        bindBtn('btn-right', () => playerMove(1));
        bindBtn('btn-down', () => playerDrop()); // Single step down
        bindBtn('btn-rotate', () => playerRotate(1));
        bindBtn('btn-hold', () => playerHold());
        
        // Special binding for the big Drop Button (Gas Pedal Logic)
        bindBtn('btn-drop', null, true);

        startBtn.addEventListener('click', () => {
            arena.forEach(row => row.fill(0));
            score = 0;
            level = 1;
            player.hold = null;
            player.canHold = true;
            updateScore();
            isGameOver = false;
            isPaused = false;
            isFastDropping = false;
            overlay.classList.add('hidden');
            playerReset();
            update();
        });

        // Initialize
        playerReset();
        draw();
        drawPreviews();

    </script>
</body>
</html>
