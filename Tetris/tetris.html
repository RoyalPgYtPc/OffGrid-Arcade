<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris Mobile v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap');

        :root {
            --bg-color: #0f0f1a;
            --ui-bg: #1a1a2e;
            --accent: #ff0055;
        }

        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: var(--bg-color);
            color: white;
            overflow: hidden;
            touch-action: none;
            height: 100dvh; /* Use dynamic viewport height for mobile browsers */
            width: 100vw;
        }

        .game-canvas {
            image-rendering: pixelated;
            background-color: rgba(0, 0, 0, 0.9);
            border: 2px solid #333;
            /* Critical fix: ensures canvas scales down but never exceeds container */
            max-height: 100%; 
            max-width: 100%;
            object-fit: contain;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            transition: transform 0.05s, background 0.05s;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .control-btn:active {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0.92);
        }

        .d-pad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 150px;
        }

        /* CRT Scanline overlay */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 5;
        }
        
        .disabled-hold {
            opacity: 0.3;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-2">

    <!-- Top Bar: Hold, Score, Next -->
    <div class="w-full max-w-lg flex justify-between items-start h-[15dvh] pt-2 z-10">
        <!-- Hold Box -->
        <div class="flex flex-col items-center">
            <div class="text-[10px] text-gray-400 font-bold mb-1 tracking-wider">HOLD</div>
            <canvas id="hold-canvas" width="80" height="80" class="bg-black/50 border border-gray-700 rounded w-[50px] h-[50px] sm:w-[70px] sm:h-[70px]"></canvas>
        </div>

        <!-- Score Board -->
        <div class="flex flex-col items-center justify-center pt-2">
            <h1 class="text-yellow-400 text-lg font-bold tracking-widest drop-shadow-md">TETRIS</h1>
            <div class="text-2xl font-mono text-white mt-1" id="score">0</div>
            <div class="text-[10px] text-gray-500">LEVEL <span id="level">1</span></div>
        </div>

        <!-- Next Box -->
        <div class="flex flex-col items-center">
            <div class="text-[10px] text-gray-400 font-bold mb-1 tracking-wider">NEXT</div>
            <canvas id="next-canvas" width="80" height="80" class="bg-black/50 border border-gray-700 rounded w-[50px] h-[50px] sm:w-[70px] sm:h-[70px]"></canvas>
        </div>
    </div>

    <!-- Game Board Container -->
    <!-- flex-1 min-h-0 is the CSS Magic that prevents overflow. It tells flexbox "I can shrink to 0 height if needed" -->
    <div class="relative flex-1 min-h-0 w-full flex items-center justify-center py-2">
        <div class="relative h-full w-full flex items-center justify-center">
            <canvas id="tetris" width="240" height="400" class="game-canvas"></canvas>
            <div class="scanlines"></div>
            
            <!-- Pause/Start Overlay -->
            <div id="overlay" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center z-20 rounded">
                <h2 id="overlay-title" class="text-4xl text-yellow-400 font-bold mb-2 tracking-tighter">READY?</h2>
                <div class="text-xs text-gray-400 mb-8 font-mono">HIGH SCORE: <span id="high-score">0</span></div>
                <button id="start-btn" class="px-8 py-4 bg-gradient-to-r from-red-600 to-pink-600 text-white font-bold rounded shadow-lg active:scale-95 transition-transform">
                    START GAME
                </button>
            </div>
        </div>
    </div>

    <!-- Controls Area -->
    <div class="w-full max-w-lg h-[25dvh] grid grid-cols-2 gap-4 pb-2 select-none z-10">
        
        <!-- Left Side: D-Pad -->
        <div class="flex items-center justify-center">
            <div class="d-pad-grid">
                <!-- Row 1 -->
                <button class="control-btn rounded-lg h-12 flex items-center justify-center bg-gray-800/50" id="btn-hold">
                    <span class="text-[10px] font-bold text-gray-300">HOLD</span>
                </button>
                <button class="control-btn rounded-lg h-12 flex items-center justify-center" id="btn-rotate">
                    <i class="fas fa-undo transform rotate-180 text-sm"></i>
                </button>
                <div class="h-12"></div> <!-- Empty -->

                <!-- Row 2 -->
                <button class="control-btn rounded-lg h-12 flex items-center justify-center" id="btn-left">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button class="control-btn rounded-lg h-12 flex items-center justify-center" id="btn-down">
                    <i class="fas fa-chevron-down"></i>
                </button>
                <button class="control-btn rounded-lg h-12 flex items-center justify-center" id="btn-right">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- Right Side: Big Action Button -->
        <div class="flex items-center justify-center pr-4">
            <button class="control-btn rounded-full w-24 h-24 bg-red-500/10 border-red-500/30 flex flex-col items-center justify-center gap-1 active:bg-red-500/30" id="btn-drop">
                <i class="fas fa-arrow-down text-2xl text-red-400"></i>
                <span class="text-[10px] font-bold text-red-300 tracking-wider">DROP</span>
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-canvas');
        const nextContext = nextCanvas.getContext('2d');
        const holdCanvas = document.getElementById('hold-canvas');
        const holdContext = holdCanvas.getContext('2d');

        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const highScoreElement = document.getElementById('high-score');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const startBtn = document.getElementById('start-btn');
        const holdBtn = document.getElementById('btn-hold');

        // Scale setup
        context.scale(20, 20); // 240/12 = 20, 400/20 = 20. Block size is 1 unit.
        nextContext.scale(15, 15); // Smaller scale for preview
        holdContext.scale(15, 15);

        // Colors
        const COLORS = [
            null,
            '#FF0D72', // T
            '#0DC2FF', // I
            '#0DFF72', // S
            '#F538FF', // Z
            '#FF8E0D', // L
            '#FFE138', // J
            '#3877FF', // O
        ];

        // State
        const arena = createMatrix(12, 20);
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isPaused = true;
        let isGameOver = false;
        let score = 0;
        let level = 1;
        let highScore = localStorage.getItem('tetris_highscore_v2') || 0;
        highScoreElement.innerText = highScore;

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            next: null,
            hold: null,
            canHold: true,
            score: 0,
        };

        // --- Core Functions ---

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'I') {
                return [
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 2, 0],
                    [0, 2, 0],
                    [0, 2, 2],
                ];
            } else if (type === 'J') {
                return [
                    [0, 3, 0],
                    [0, 3, 0],
                    [3, 3, 0],
                ];
            } else if (type === 'O') {
                return [
                    [4, 4],
                    [4, 4],
                ];
            } else if (type === 'Z') {
                return [
                    [5, 5, 0],
                    [0, 5, 5],
                    [0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 6, 6],
                    [6, 6, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'T') {
                return [
                    [0, 7, 0],
                    [7, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        function drawMatrix(matrix, offset, ctx) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = COLORS[value];
                        // Draw block
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        // Lighting effect (Bevel)
                        ctx.lineWidth = 0.05;
                        ctx.strokeStyle = 'white';
                        ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);

                        // Inner dark
                        ctx.fillStyle = 'rgba(0,0,0,0.1)';
                        ctx.fillRect(x + offset.x + 0.1, y + offset.y + 0.1, 0.8, 0.8);
                    }
                });
            });
        }

        function draw() {
            // Fill background
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0}, context);
            drawMatrix(player.matrix, player.pos, context);
        }

        function drawPreviews() {
            // Draw Next
            nextContext.fillStyle = '#111';
            nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            if (player.next) {
                const centerOffset = (5 - player.next[0].length) / 2; // Rough centering
                drawMatrix(player.next, {x: centerOffset, y: 1}, nextContext);
            }

            // Draw Hold
            holdContext.fillStyle = '#111';
            holdContext.fillRect(0, 0, holdCanvas.width, holdCanvas.height);
            if (player.hold) {
                const centerOffset = (5 - player.hold[0].length) / 2;
                drawMatrix(player.hold, {x: centerOffset, y: 1}, holdContext);
            }

            // Visual feedback for Hold button
            if (!player.canHold) {
                holdBtn.classList.add('disabled-hold');
                holdBtn.style.borderColor = "#333";
            } else {
                holdBtn.classList.remove('disabled-hold');
                holdBtn.style.borderColor = "rgba(255, 255, 255, 0.15)";
            }
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
                player.canHold = true; // Re-enable hold after drop
                drawPreviews();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
            player.canHold = true;
            drawPreviews();
        }

        function playerMove(offset) {
            player.pos.x += offset;
            if (collide(arena, player)) {
                player.pos.x -= offset;
            }
        }

        function playerHold() {
            if (!player.canHold || isPaused || isGameOver) return;

            if (player.hold === null) {
                // First hold
                player.hold = player.matrix;
                playerReset(true); // true = don't reset hold flag, we do it here
            } else {
                // Swap
                const temp = player.matrix;
                player.matrix = player.hold;
                player.hold = temp;
                
                // Reposition new piece
                player.pos.y = 0;
                player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            }
            
            player.canHold = false;
            drawPreviews();
        }

        function playerReset(fromHold = false) {
            const pieces = 'ILJOTSZ';
            if (!fromHold) {
                if (player.next === null) {
                    player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
                }
                player.matrix = player.next;
                player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
            }
            
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            if (collide(arena, player)) {
                isGameOver = true;
                isPaused = true;
                overlayTitle.innerText = "GAME OVER";
                startBtn.innerText = "RESTART";
                overlay.classList.remove('hidden');
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('tetris_highscore_v2', highScore);
                    highScoreElement.innerText = highScore;
                }
            }
            drawPreviews();
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] &&
                        arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length -1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }

                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                score += rowCount * 10;
                rowCount *= 2;
            }
        }

        function updateScore() {
            scoreElement.innerText = score;
            // Level up every 200 points
            level = Math.floor(score / 200) + 1;
            levelElement.innerText = level;
            // Increase speed with level
            dropInterval = Math.max(100, 1000 - (level * 50)); 
        }

        function update(time = 0) {
            if (!isPaused && !isGameOver) {
                const deltaTime = time - lastTime;
                lastTime = time;

                dropCounter += deltaTime;
                if (dropCounter > dropInterval) {
                    playerDrop();
                }

                draw();
                requestAnimationFrame(update);
            }
        }

        // --- Inputs ---

        document.addEventListener('keydown', event => {
            if (isPaused) return;
            if (event.keyCode === 37) playerMove(-1);
            else if (event.keyCode === 39) playerMove(1);
            else if (event.keyCode === 40) playerDrop();
            else if (event.keyCode === 38) playerRotate(1);
            else if (event.keyCode === 32) playerHardDrop();
            else if (event.keyCode === 16 || event.keyCode === 67) playerHold(); // Shift or C
        });

        function bindBtn(id, action) {
            const btn = document.getElementById(id);
            ['mousedown', 'touchstart'].forEach(evt => 
                btn.addEventListener(evt, (e) => {
                    e.preventDefault();
                    if (!isPaused && !isGameOver) action();
                }, {passive: false})
            );
        }

        bindBtn('btn-left', () => playerMove(-1));
        bindBtn('btn-right', () => playerMove(1));
        bindBtn('btn-down', () => playerDrop());
        bindBtn('btn-rotate', () => playerRotate(1));
        bindBtn('btn-drop', () => playerHardDrop());
        bindBtn('btn-hold', () => playerHold());

        startBtn.addEventListener('click', () => {
            arena.forEach(row => row.fill(0));
            score = 0;
            level = 1;
            player.hold = null;
            player.canHold = true;
            updateScore();
            isGameOver = false;
            isPaused = false;
            overlay.classList.add('hidden');
            playerReset();
            update();
        });

        // Initialize
        playerReset();
        draw();
        drawPreviews();

    </script>
</body>
</html>
